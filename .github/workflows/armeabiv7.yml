name: Build ARMEABIv7 with GPU & OpenMP

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

env:
  JAVA_VERSION: '21'
  ANDROID_SDK_VERSION: '36'
  NDK_VERSION: '28.2.13676358'
  BUILD_TOOLS_VERSION: '36.0.0'
  CMAKE_VERSION: '3.22.1'

jobs:
  build-armeabiv7-gpu:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;28.2.13676358
            cmake;3.22.1
          log-accepted-licenses: true

      - name: Create local.properties
        shell: bash
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "ndk.dir=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}"
            echo "cmake.dir=$ANDROID_HOME/cmake/${{ env.CMAKE_VERSION }}"
          } > local.properties
          cat local.properties

      - name: Patch build.gradle.kts for ARMEABIv7
        shell: bash
        run: |
          set -euo pipefail
          # Backup original
          cp app/build.gradle.kts app/build.gradle.kts.bak

          cat > /tmp/armeabi_config.kts << 'GRADLE_EOF'

          // ARMEABIv7 Configuration Overrides
          android {
              defaultConfig {
                  ndk {
                      abiFilters.clear()
                      abiFilters += listOf("armeabi-v7a")
                  }
                  externalNativeBuild {
                      cmake {
                          cppFlags += listOf(
                              "-std=c++17",
                              "-march=armv7-a",
                              "-mfpu=neon",
                              "-mfloat-abi=softfp",
                              "-fopenmp",
                              "-O3"
                          )
                          arguments += listOf(
                              "-DANDROID_STL=c++_shared",
                              "-DGGML_VULKAN=ON",
                              "-DGGML_OPENMP=ON"
                          )
                      }
                  }
              }
          }
          GRADLE_EOF
          # NOTE: the two -D arguments above were renamed from -DENABLE_VULKAN /
          # -DENABLE_OPENMP to -DGGML_VULKAN / -DGGML_OPENMP. Upstream ggml
          # declares these as `option(GGML_VULKAN ...)` / `option(GGML_OPENMP ...)`,
          # and the "Patch CMakeLists.txt" step below also targets GGML_VULKAN /
          # GGML_OPENMP directly — so ENABLE_VULKAN/ENABLE_OPENMP were CMake cache
          # variables nothing reads, silently doing nothing.

          awk '
            NR==1 {print; print ""}
            /^dependencies \{/ && !done {
              system("cat /tmp/armeabi_config.kts")
              print ""
              done=1
            }
            {print}
          ' app/build.gradle.kts.bak > app/build.gradle.kts.tmp && mv app/build.gradle.kts.tmp app/build.gradle.kts

          # Verify the patch actually landed instead of silently no-op'ing if the
          # "dependencies {" anchor line doesn't match the real file.
          if ! grep -q "ARMEABIv7 Configuration Overrides" app/build.gradle.kts; then
            echo "❌ ERROR: could not inject ARMEABIv7 config into build.gradle.kts." >&2
            echo "   The '^dependencies {' anchor line was not found as expected." >&2
            echo "   Check app/build.gradle.kts for how its dependencies block is declared." >&2
            exit 1
          fi
          echo "✓ Patched build.gradle.kts"

      - name: Patch CMakeLists.txt for Vulkan & OpenMP
        shell: bash
        run: |
          set -euo pipefail
          cp app/src/main/cpp/CMakeLists.txt app/src/main/cpp/CMakeLists.txt.bak

          sed -i 's/set(GGML_VULKAN OFF/set(GGML_VULKAN ON/' app/src/main/cpp/CMakeLists.txt
          sed -i 's/set(GGML_OPENMP OFF/set(GGML_OPENMP ON/' app/src/main/cpp/CMakeLists.txt

          cat > /tmp/armeabi_backends.cmake << 'CMAKE_EOF'

          # ──────────────────────────────────────────────────
          # ARMEABIv7 with GPU (Vulkan) & Parallel (OpenMP)
          # ──────────────────────────────────────────────────
          if(ANDROID_ABI STREQUAL "armeabi-v7a")
              message(STATUS "⚙️  Configuring ARMEABIv7 with Vulkan + OpenMP")

              set(AGORA_ANDROID_CPU_BACKENDS
                  ggml-cpu-android_armv7.0_1
                  ggml-cpu-android_armv7.0_2
                  ggml-cpu-android_armv7.2_1
                  ggml-cpu-android_armv7.2_2
              )

              add_compile_options(
                  -march=armv7-a
                  -mfpu=neon
                  -mfloat-abi=softfp
                  -fopenmp
                  -O3
                  -ffast-math
              )

              add_compile_definitions(
                  GGML_USE_VULKAN=1
                  GGML_USE_OPENMP=1
              )

              message(STATUS "✓ ARMEABIv7 configuration applied")
          endif()
          CMAKE_EOF

          awk '
            /if\(ANDROID_ABI STREQUAL \"arm64-v8a\"\)/ && !done {
              system("cat /tmp/armeabi_backends.cmake")
              print ""
              done=1
            }
            {print}
          ' app/src/main/cpp/CMakeLists.txt.bak > app/src/main/cpp/CMakeLists.txt.tmp && mv app/src/main/cpp/CMakeLists.txt.tmp app/src/main/cpp/CMakeLists.txt

          # Verify each patch actually took effect. GGML_VULKAN defaults to OFF
          # upstream, so if this doesn't land, Vulkan silently never turns on —
          # that's the entire point of this workflow, so fail loudly instead of
          # shipping a "successful" build without GPU support.
          if ! grep -q "GGML_VULKAN ON" app/src/main/cpp/CMakeLists.txt; then
            echo "❌ ERROR: 'set(GGML_VULKAN OFF' was not found/replaced in CMakeLists.txt." >&2
            echo "   Vulkan will NOT be enabled. The file may no longer declare it that way." >&2
            exit 1
          fi
          if ! grep -q "GGML_OPENMP ON" app/src/main/cpp/CMakeLists.txt; then
            echo "⚠️  WARNING: 'set(GGML_OPENMP OFF' was not found/replaced."
            echo "   This is only a real problem if your CMakeLists.txt doesn't already"
            echo "   default OpenMP to ON upstream (stock ggml does default it to ON)."
          fi
          if ! grep -q "ARMEABIv7 with GPU (Vulkan) & Parallel (OpenMP)" app/src/main/cpp/CMakeLists.txt; then
            echo "❌ ERROR: could not inject the ARMEABIv7 backend block into CMakeLists.txt." >&2
            echo "   The 'if(ANDROID_ABI STREQUAL \"arm64-v8a\")' anchor line was not found." >&2
            exit 1
          fi

          echo "✓ Patched CMakeLists.txt with ARMEABIv7 configuration"

      - name: Configure Gradle properties
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.workers.max=4
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=36
          EOF
          echo "✓ Gradle properties configured"

      # On push/PR this now builds the release variants (what you'd actually
      # install on the phone); the debug build is opt-in via workflow_dispatch.
      # Flip these two conditions if you'd rather default to debug on push/PR.
      - name: Build Debug APK (ARMEABIv7)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'debug'
        run: |
          ./gradlew :app:assembleFdroidDebug \
            --no-daemon \
            --build-cache \
            -x lint \
            -x lintDebug \
            --info 2>&1 | tee build-debug.log

      - name: Build Release APK (ARMEABIv7)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'release'
        run: |
          ./gradlew :app:assembleFdroidRelease :app:assemblePlayRelease \
            --no-daemon \
            --build-cache \
            -x lint \
            -x lintRelease \
            --info 2>&1 | tee build-release.log

      - name: Build Release Bundle (ARMEABIv7)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'release'
        run: |
          ./gradlew :app:bundlePlayRelease \
            --no-daemon \
            --build-cache \
            -x lint \
            --info 2>&1 | tee build-bundle.log

      - name: Verify ARMEABIv7 native libraries
        if: always()
        shell: bash
        run: |
          echo "════════════════════════════════════════════"
          echo "  ARMEABIv7 Native Library Verification"
          echo "════════════════════════════════════════════"

          FOUND=0
          echo ""
          echo "📚 Searching for armeabi-v7a libraries..."
          for lib in $(find app/build -path "*armeabi-v7a*" -name "*.so" -type f 2>/dev/null); do
            echo "  ✓ $(basename "$lib")"
            FOUND=$((FOUND+1))
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "  ⚠️  No ARMEABIv7 libraries found"
          else
            echo "  Found: $FOUND libraries"
          fi

          echo ""
          echo "🔍 Checking for OpenMP and Vulkan symbols..."
          for lib in $(find app/build -path "*armeabi-v7a*" -name "agora_llama.so" -type f 2>/dev/null); do
            echo ""
            echo "  Library: $(basename "$lib")"

            if nm "$lib" 2>/dev/null | grep -q "omp_"; then
              echo "    ✓ OpenMP symbols found"
            else
              echo "    ⚠️  No OpenMP symbols detected"
            fi

            if nm "$lib" 2>/dev/null | grep -q "vk"; then
              echo "    ✓ Vulkan symbols found"
            else
              echo "    ⚠️  Vulkan symbols not detected — check the patch steps above for errors"
            fi
          done
          echo ""

      - name: Upload APK Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agora-armeabiv7-apk
          path: |
            app/build/outputs/apk/fdroid/release/
            app/build/outputs/apk/play/release/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Bundle Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agora-armeabiv7-bundle
          path: app/build/outputs/bundle/playRelease/
          if-no-files-found: warn
          retention-days: 30

      - name: Generate Build Report
        if: always()
        shell: bash
        run: |
          {
            echo "# 🚀 ARMEABIv7 GPU Build Report"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **Target ABI** | armeabi-v7a (32-bit ARM with NEON) |"
            echo "| **Build Date** | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |"
            echo "| **GPU Support** | Vulkan ✓ |"
            echo "| **Parallel Compute** | OpenMP ✓ |"
            echo "| **NDK Version** | ${{ env.NDK_VERSION }} |"
            echo "| **Build Tools** | ${{ env.BUILD_TOOLS_VERSION }} |"
            echo "| **Compiler Flags** | \`-march=armv7-a -mfpu=neon -mfloat-abi=softfp -fopenmp -O3\` |"
            echo ""

            echo "## Build Outputs"
            echo ""

            if find app/build/outputs/apk -name "*.apk" 2>/dev/null | grep -q .; then
              echo "### APKs"
              echo "\`\`\`"
              ls -lh app/build/outputs/apk/*/release/*.apk 2>/dev/null || echo "None"
              echo "\`\`\`"
              echo ""
            fi

            if find app/build/outputs/bundle -name "*.aab" 2>/dev/null | grep -q .; then
              echo "### Bundles"
              echo "\`\`\`"
              ls -lh app/build/outputs/bundle/*/app-*.aab 2>/dev/null || echo "None"
              echo "\`\`\`"
              echo ""
            fi

            echo "## Configuration Applied"
            echo "- ✅ build.gradle.kts patched with ARMEABIv7 ABI filter"
            echo "- ✅ CMakeLists.txt updated with Vulkan + OpenMP enabled"
            echo "- ✅ ARMv7-a CPU backends configured (armv7.0, armv7.2)"
            echo "- ✅ NEON FPU acceleration enabled"
            echo "- ✅ Compiler optimizations (-O3 -ffast-math)"
            echo ""

            echo "## Next Steps"
            echo "1. Download APK artifacts from the job summary"
            echo "2. Test on ARMEABIv7 devices to verify GPU/OpenMP functionality"
            echo "3. Check logcat for Vulkan/OpenMP initialization messages"

          } > report.md
          cat report.md

      - name: Upload Build Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report-armeabiv7
          path: report.md

      - name: Comment PR with Build Status
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const report = fs.readFileSync('report.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: report
              });
              console.log('✓ Posted build report to PR');
            } catch (e) {
              console.log('ℹ️  No PR context or report file:', e.message);
            }

      # Fixed: the old "[ -f x ] && mv ... && echo" pattern fails the whole step
      # under `set -e` whenever the .bak file doesn't exist — which is exactly
      # what happens when an earlier step (e.g. the patch steps) never ran. Using
      # proper if-blocks means a missing backup is treated as "nothing to
      # restore", not as an error.
      - name: Restore original files
        if: always()
        shell: bash
        run: |
          if [ -f app/build.gradle.kts.bak ]; then
            mv app/build.gradle.kts.bak app/build.gradle.kts
            echo "✓ Restored build.gradle.kts"
          else
            echo "ℹ️  No build.gradle.kts.bak found — nothing to restore"
          fi

          if [ -f app/src/main/cpp/CMakeLists.txt.bak ]; then
            mv app/src/main/cpp/CMakeLists.txt.bak app/src/main/cpp/CMakeLists.txt
            echo "✓ Restored CMakeLists.txt"
          else
            echo "ℹ️  No CMakeLists.txt.bak found — nothing to restore"
          fi
