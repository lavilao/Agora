name: GLM-53 Android APK (Vulkan)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  NDK_VERSION: "27.2.12479018"                # NDK r27c
  SPIRV_HEADERS_TAG: "vulkan-sdk-1.4.313.0"   # tag real de KhronosGroup/SPIRV-Headers
  LLAMA_DIR: thirdparty/llama.cpp
  NATIVE_BUILD_DIR: build-android
  JNI_LIBS_DIR: app/src/main/jniLibs          # ← ajusta al módulo de tu app
  ANDROID_ABI: arm64-v8a
  ANDROID_PLATFORM: android-28                # Vulkan 1.1+
  BUILD_TYPE: Release
  VULKAN_SDK: /usr/local

jobs:
  build-apk:
    name: APK arm64-v8a · Vulkan
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo + submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle (con caché de dependencias)
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar NDK r27c
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}"   >> "$GITHUB_ENV"

      # glslc: lo ejecuta el HOST en configure-time (tests de extensiones)
      # y vulkan-shaders-gen al compilar los shaders. Ni runner ni NDK lo traen.
      - name: Compilar glslc (shaderc)
        run: |
          git clone --depth 1 --recursive https://github.com/google/shaderc /tmp/shaderc
          cmake -S /tmp/shaderc -B /tmp/shaderc-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSHADERC_SKIP_TESTS=ON \
            -DSHADERC_SKIP_INSTALL=ON
          cmake --build /tmp/shaderc-build -j"$(nproc)"
          GLSLC_BIN="$(find /tmp/shaderc-build -type f -name glslc -perm -u+x | head -1)"
          sudo install -m755 "$GLSLC_BIN" /usr/local/bin/glslc
          glslc --version

      # SPIRV-Headers (header-only → seguro en cross-compile) → /usr/local
      - name: Instalar SPIRV-Headers en /usr/local
        run: |
          git clone --depth 1 --branch "${SPIRV_HEADERS_TAG}" \
            https://github.com/KhronosGroup/SPIRV-Headers /tmp/spirv-headers
          cmake -S /tmp/spirv-headers -B /tmp/spirv-headers-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --install /tmp/spirv-headers-build
          ls /usr/local/share/cmake/SPIRV-Headers/

      # ⚠️ EL FIX: MODE_PACKAGE=BOTH → find_package(CONFIG) busca en el
      # sysroot del NDK Y en /usr/local real (SPIRV-Headers).
      - name: Configurar llama.cpp (NDK toolchain + Vulkan + fix)
        run: |
          cmake -S "${LLAMA_DIR}" -B "${NATIVE_BUILD_DIR}" \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${ANDROID_ABI}" \
            -DANDROID_PLATFORM="${ANDROID_PLATFORM}" \
            -DGGML_VULKAN=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_CURL=OFF \
            -DCMAKE_PREFIX_PATH=/usr/local \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH

      - name: Compilar libggml / libllama (.so + shaders Vulkan embebidos)
        run: cmake --build "${NATIVE_BUILD_DIR}" -j"$(nproc)"

      - name: Copiar .so → jniLibs (+ strip)
        run: |
          mkdir -p "${JNI_LIBS_DIR}/${ANDROID_ABI}"
          find "${NATIVE_BUILD_DIR}" -name '*.so' -type f \
            -exec cp {} "${JNI_LIBS_DIR}/${ANDROID_ABI}/" \;
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            "${JNI_LIBS_DIR}/${ANDROID_ABI}"/*.so
          ls -lh "${JNI_LIBS_DIR}/${ANDROID_ABI}/"

      - name: Gradle assembleDebug
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
        # Si tu proyecto Gradle vive en un subdir: cd android && ./gradlew assembleDebug

      - name: Recolectar artifacts
        run: |
          mkdir -p artifacts
          find . -name '*.apk' -path '*build/outputs*' \
            -not -path './thirdparty/*' -exec cp {} artifacts/ \;
          cp "${JNI_LIBS_DIR}/${ANDROID_ABI}"/*.so artifacts/
          ls -lh artifacts/

      - name: Subir APK + librerías nativas
        uses: actions/upload-artifact@v4
        with:
          name: glm53-apk-arm64-vulkan
          path: artifacts/
          if-no-files-found: error
